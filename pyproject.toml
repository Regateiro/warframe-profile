[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "warframe-profile"
version = "1.0"
description = "Warframe prime part inventory analyzer"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["warframe", "inventory", "ducats", "mastery", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = ["prettytable>=3.9,<4"]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
warframe = "warframe_profile.__main__:main"

[tool.setuptools.packages.find]
include = ["warframe_profile*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "N"]
ignore = ["N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
