name: Build Linux executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Linux and Windows release runs share this group, so they cannot create the
# same GitHub release simultaneously.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-exe:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build one-file executable
        run: |
          python -m PyInstaller --clean --noconfirm \
            --distpath dist/linux --workpath build/linux warframe.spec

      - name: Smoke test
        run: dist/linux/warframe-profile --help

      - name: Create checksum
        run: |
          cd dist/linux
          sha256sum warframe-profile > warframe-profile.sha256

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: warframe-profile-linux-x64
          path: |
            dist/linux/warframe-profile
            dist/linux/warframe-profile.sha256
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Generate the changelog only when creating the release. Both
          # platform jobs upload to the same release, so regenerating notes
          # here would append duplicate "Full Changelog" sections.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            dist/linux/warframe-profile \
            dist/linux/warframe-profile.sha256 \
            --clobber
