name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Linux and Windows release runs share this group, so they cannot create the
# same GitHub release simultaneously.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up 64-bit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build one-file executable
        run: python -m PyInstaller --clean --noconfirm warframe.spec

      - name: Smoke test
        run: dist\warframe-profile.exe --help

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\warframe-profile.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  warframe-profile.exe" | Set-Content dist\warframe-profile.exe.sha256

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: warframe-profile-windows-x64
          path: |
            dist/warframe-profile.exe
            dist/warframe-profile.exe.sha256
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/warframe-profile.exe
            dist/warframe-profile.exe.sha256
